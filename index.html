<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi PPDB SMP DIY 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
        select, input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-top: 5px; }
        .hidden { display: none; }
        .result-box { border-left: 4px solid #2563eb; background: #eff6ff; padding: 15px; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-800">Cek Jalur PPDB SMP Negeri DIY 2026</h1>
            <p class="text-gray-600">Berdasarkan Juknis Kota Yogyakarta, Sleman, Bantul, & Kulon Progo</p>
        </header>

        <div class="card">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Data Domisili & Sekolah</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label>Pilih Wilayah Tujuan SMP:</label>
                    <select id="wilayah">
                        <option value="kota">Kota Yogyakarta</option>
                        <option value="sleman">Kab. Sleman</option>
                        <option value="bantul">Kab. Bantul</option>
                        <option value="kp">Kab. Kulon Progo</option>
                    </select>
                </div>
                <div>
                    <label>Asal KK (Wilayah):</label>
                    <select id="asal_kk">
                        <option value="dalam">Dalam Kabupaten/Kota Tujuan</option>
                        <option value="luar_diy">Luar DIY</option>
                        <option value="antar_diy">Antar Kabupaten/Kota di DIY</option>
                    </select>
                </div>
                <div>
                    <label>Tanggal Terbit KK:</label>
                    <input type="date" id="tgl_kk" value="2025-01-01">
                    <small class="text-red-500">*Umumnya minimal 1 tahun (sebelum 1 Juli 2025) </small>
                </div>
                <div>
                    <label>Status Keluarga di KK:</label>
                    <select id="status_kk">
                        <option value="anak">Anak Kandung/Cucu</option>
                        <option value="famili">Famili Lain (Numpang KK)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Kondisi Khusus & Prestasi</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label>Status Ekonomi:</label>
                    <select id="ekonomi">
                        <option value="reguler">Mampu / Umum</option>
                        <option value="miskin">Keluarga Miskin (KMS/KKS/DTKS)</option>
                    </select>
                </div>
                <div>
                    <label>Prestasi Non-Akademik:</label>
                    <select id="prestasi">
                        <option value="0">Tidak Ada</option>
                        <option value="kab">Tingkat Kabupaten (Juara 1-3)</option>
                        <option value="prov">Tingkat Provinsi (Juara 1-3)</option>
                        <option value="nas">Tingkat Nasional/Intl</option>
                    </select>
                </div>
                <div>
                    <label>Mutasi Orang Tua:</label>
                    <select id="mutasi">
                        <option value="tidak">Tidak Ada Perpindahan Tugas</option>
                        <option value="ya">Ada SK Pindah Tugas (ASN/TNI/Polri/BUMN)</option>
                    </select>
                </div>
                <div>
                    <label>Radius Tempat Tinggal:</label>
                    <select id="radius">
                        <option value="jauh">Di luar radius sekolah</option>
                        <option value="dekat">Sangat Dekat (Radius < 300-600m)</option>
                    </select>
                </div>
            </div>
        </div>

        <button onclick="hitungJalur()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">CEK KESIMPULAN JALUR</button>

        <div id="hasil" class="mt-8 hidden">
            <div class="card result-box">
                <h2 class="text-2xl font-bold text-blue-900 mb-4">Analisis Jalur Yang Bisa Ditempuh:</h2>
                <div id="daftar_jalur" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        function hitungJalur() {
            const wilayah = document.getElementById('wilayah').value;
            const asalKK = document.getElementById('asal_kk').value;
            const tglKK = new Date(document.getElementById('tgl_kk').value);
            const statusKK = document.getElementById('status_kk').value;
            const ekonomi = document.getElementById('ekonomi').value;
            const prestasi = document.getElementById('prestasi').value;
            const mutasi = document.getElementById('mutasi').value;
            const radius = document.getElementById('radius').value;

            const batasKK = new Date('2025-07-01');
            const isKKValid = tglKK <= batasKK;

            let jalurTersedia = [];

            // 1. Jalur Zonasi / Domisili
            if (asalKK === 'dalam' && isKKValid) {
                if (radius === 'dekat') {
                    jalurTersedia.push({
                        nama: "Zonasi Radius / Domisili Radius",
                        ket: "Prioritas utama berdasarkan jarak udara terdekat (Sleman: 300-600m tergantung sekolah)[cite: 1014, 1212].",
                        tgl: "Minggu ke-2 Juni 2026",
                        lokasi: "Online / Sekolah Tujuan"
                    });
                }
                jalurTersedia.push({
                    nama: "Zonasi Wilayah / Domisili Wilayah",
                    ket: "Berdasarkan kelurahan/padukuhan yang masuk dalam daftar zonasi sekolah tujuan[cite: 1020, 2161].",
                    tgl: "Minggu ke-3 Juni 2026",
                    lokasi: "Online (Portal PPDB Daerah)"
                });
            }

            // 2. Jalur Afirmasi
            if (ekonomi === 'miskin') {
                jalurTersedia.push({
                    nama: "Jalur Afirmasi (Keluarga Miskin)",
                    ket: "Wajib terdaftar di DTKS atau memiliki kartu kemiskinan daerah.",
                    tgl: "Awal Juni 2026",
                    lokasi: "Dinas Pendidikan / Online"
                });
            }

            // 3. Jalur Prestasi
            if (prestasi !== '0' || asalKK !== 'luar_diy') {
                jalurTersedia.push({
                    nama: "Jalur Prestasi (Akademik/Non-Akademik)",
                    ket: "Menggunakan Nilai Gabungan (Rapor + ASPD) dan tambahan poin sertifikat kejuaraan.",
                    tgl: "Minggu ke-3 Juni 2026",
                    lokasi: "Online"
                });
            }

            // 4. Jalur Mutasi
            if (mutasi === 'ya') {
                jalurTersedia.push({
                    nama: "Jalur Perpindahan Tugas Orang Tua",
                    ket: "Untuk anak ASN/TNI/Polri/Pegawai BUMN yang pindah tugas ke wilayah tujuan.",
                    tgl: "Juni 2026 (Bersamaan Afirmasi)",
                    lokasi: "Sekolah Tujuan / Dinas Pendidikan"
                });
            }

            // Validasi Khusus Numpang KK (Famili Lain)
            if (statusKK === 'famili' && wilayah === 'kota') {
                // Kota Jogja ketat terhadap status famili lain
                jalurTersedia = jalurTersedia.map(j => {
                    if (j.nama.includes("Zonasi")) {
                        return {...j, ket: j.ket + " (Peringatan: Status 'Famili Lain' mungkin mendapat prioritas lebih rendah di Kota Yogyakarta)."};
                    }
                    return j;
                });
            }

            // Tampilkan Hasil
            const daftarDiv = document.getElementById('daftar_jalur');
            daftarDiv.innerHTML = '';
            
            if (jalurTersedia.length === 0) {
                daftarDiv.innerHTML = "<p class='text-red-600 font-bold'>Maaf, berdasarkan kriteria Anda, tidak ada jalur yang cocok secara otomatis. Periksa kembali tanggal KK atau status domisili Anda.</p>";
            } else {
                jalurTersedia.forEach(j => {
                    daftarDiv.innerHTML += `
                        <div class="border-b pb-2">
                            <h3 class="text-lg font-bold text-blue-700">${j.nama}</h3>
                            <p class="text-sm text-gray-700"><strong>Keterangan:</strong> ${j.ket}</p>
                            <p class="text-sm text-gray-700"><strong>Estimasi Jadwal:</strong> ${j.tgl}</p>
                            <p class="text-sm text-gray-700"><strong>Tempat:</strong> ${j.lokasi}</p>
                        </div>
                    `;
                });
            }

            document.getElementById('hasil').classList.remove('hidden');
            window.scrollTo({ top: document.getElementById('hasil').offsetTop, behavior: 'smooth' });
        }
    </script>
</body>
</html>
